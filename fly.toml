# Fly.io deploy config for the analysis API
# fly launch / fly deploy from repo root after creating the app

app = "interdependency-api"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[env]
  PORT = "8787"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
