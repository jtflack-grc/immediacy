name: Map feedback check

on:
  push:
    branches: [fix/restore-map-feedback]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Match the production Pages workflow for the Windows-generated lockfile.
      - run: npm install
      - run: npm test
      - run: npm run build
