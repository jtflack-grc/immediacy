name: Deploy analysis API (Fly)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "data/**"
      - "packages/shared/**"
      - "fly.toml"
      - "package.json"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Add repository secret FLY_API_TOKEN (fly tokens create deploy) then re-run."
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            CORS_ORIGINS="https://jtflack-grc.github.io,http://localhost:5275,http://127.0.0.1:5275" \
            SEC_USER_AGENT="Interdependency Educational TPRM jtflack-grc@users.noreply.github.com" \
            --stage || true
          flyctl deploy --remote-only --ha=false

