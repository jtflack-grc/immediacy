name: Build EDGAR dossiers (Pages search pack)

# No Fly / no personal API keys in the web app.
# GitHub-hosted runners fetch EDGAR with a public project User-Agent and
# commit static dossiers the Pages site can search.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to build"
        required: true
        default: "HAYW,AAPL,MSFT,AMZN,GOOGL,META,NVDA,JPM,XOM,UNH,CLX,CRWD,IBM,ORCL,CRM"
  schedule:
    # Weekly refresh of the public search pack
    - cron: "17 11 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@interdependency/shared
      - run: npm run build --workspace=@interdependency/api
      - name: Build dossiers
        env:
          SEC_USER_AGENT: InterdependencyCI/0.1 (https://github.com/jtflack-grc/interdependency; jtflack-grc@users.noreply.github.com)
          TICKERS: ${{ github.event.inputs.tickers || 'HAYW,AAPL,MSFT,AMZN,GOOGL,META,NVDA,JPM,XOM,UNH,CLX,CRWD,IBM,ORCL,CRM' }}
        run: node scripts/build-dossier.mjs
      - name: Commit search pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/dossiers web/public/kb/company_tickers.json web/public/kb/sample-corpora || true
          if git diff --staged --quiet; then
            echo "No dossier changes"
          else
            git commit -m "Refresh EDGAR dossier search pack"
            git push
          fi
