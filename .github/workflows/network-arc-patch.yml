name: Network arc patch

on:
  push:
    branches:
      - fix/restore-network-arcs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-network-arcs
      - name: Patch globe network arcs
        run: python scripts/patch_network_arcs.py
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- src/components/GlobePanel.tsx; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobePanel.tsx
          git commit -m "Restore directional network arcs"
          git push origin HEAD:fix/restore-network-arcs
