name: Branch check

on:
  push:
    branches: [feat/three-rail-visual-system]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Match the production Pages workflow: npm ci fails on optional
      # platform packages from the Windows-generated lockfile.
      - run: npm install
      - run: npm test
      - run: npm run build
